<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1120" width="1560" height="1120">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.14" stop-color="#f0f4f5"/>
      <stop offset="0.34" stop-color="#b9c5c9"/>
      <stop offset="0.50" stop-color="#8b989e"/>
      <stop offset="0.60" stop-color="#c9d4d8"/>
      <stop offset="0.80" stop-color="#eef3f4"/>
      <stop offset="1"    stop-color="#9fadb2"/>
    </linearGradient>

    <linearGradient id="chromeBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#fdfefe"/>
      <stop offset="0.38" stop-color="#d2dcdf"/>
      <stop offset="0.58" stop-color="#93a1a7"/>
      <stop offset="1"    stop-color="#e8eef0"/>
    </linearGradient>

    <linearGradient id="carBody" x1="0.15" y1="0" x2="0.42" y2="1">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.26" stop-color="#e8eef0"/>
      <stop offset="0.52" stop-color="#aab8be"/>
      <stop offset="0.74" stop-color="#859399"/>
      <stop offset="1"    stop-color="#6d7b86"/>
    </linearGradient>

    <linearGradient id="starGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#f2f6f7"/>
      <stop offset="0.48" stop-color="#b9c5c9"/>
      <stop offset="0.54" stop-color="#8e9ba1"/>
      <stop offset="1"   stop-color="#c8d2d6"/>
    </linearGradient>

    <linearGradient id="limeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#8ff24a"/>
      <stop offset="1"   stop-color="#78e02f"/>
    </linearGradient>
  </defs>

  <!-- ══ Crown: pointed gable with flared shoulders ══════════════════ -->
  <path fill="url(#chrome)" d="
    M 780 116
    L 1258 300
    L 1258 470
    L 1330 452 L 1372 500
    L 1258 500 L 1258 486
    L 1258 300
    L 780 128
    L 302 300
    L 302 486 L 302 500
    L 188 500 L 230 452 L 302 470
    L 302 300 Z"/>

  <!-- Outer gable stroke -->
  <path fill="none" stroke="url(#chrome)" stroke-width="30" stroke-linejoin="round" d="
    M 302 486 L 302 306 L 780 130 L 1258 306 L 1258 486"/>

  <!-- Inner dark gable face -->
  <path fill="#101314" d="
    M 780 168 L 1222 330 L 1222 700 L 338 700 L 338 330 Z"/>

  <!-- Inner thin chrome outline following the gable -->
  <path fill="none" stroke="#9fadb2" stroke-width="7" d="
    M 356 500 L 356 344 L 780 188 L 1204 344 L 1204 500"/>

  <!-- Flared shoulder tabs -->
  <path fill="url(#chrome)" d="M 188 500 L 302 470 L 302 500 Z"/>
  <path fill="url(#chrome)" d="M 1372 500 L 1258 470 L 1258 500 Z"/>

  <!-- ══ Banner ══════════════════════════════════════════════════════ -->
  <path fill="#101314" d="M 186 500 L 1374 500 L 1374 700 L 186 700 Z"/>

  <!-- ══ Car silhouette ══════════════════════════════════════════════ -->
  <g transform="translate(780,368) scale(0.86) translate(-450,-124)">
    <g fill="url(#carBody)">
      <path d="M 30 150 L 140 150 L 118 170 L 8 170 Z"/>
      <path d="M 62 182 L 158 182 L 140 200 L 44 200 Z"/>
    </g>

    <path fill="url(#carBody)" d="
      M 148 128
      C 234 72 348 34 468 28
      C 588 22 688 44 768 82
      C 698 64 618 58 538 66
      C 398 80 266 104 174 142 Z"/>

    <path fill="url(#carBody)" fill-rule="evenodd" d="
      M 118 186
      C 150 156 210 126 286 106
      C 380 82 486 76 576 92
      C 654 106 722 134 786 166
      C 826 186 858 196 866 206
      C 872 214 864 220 848 220
      L 118 220
      C 106 220 104 194 118 186 Z
      M 246 220 a 52 52 0 0 1 104 0 Z
      M 612 220 a 52 52 0 0 1 104 0 Z"/>

    <path fill="#101314" d="
      M 424 106 C 452 103 484 101 516 101 L 546 172 L 338 172
      C 360 150 392 126 424 106 Z"/>
    <path fill="#101314" d="
      M 556 102 C 612 106 664 120 710 140 C 736 152 758 164 776 176 L 586 176 Z"/>
  </g>

  <!-- ══ Type ════════════════════════════════════════════════════════ -->

  <!-- M.R -->
  <text x="780" y="268" text-anchor="middle"
        font-family="BarlowCondItalic" font-weight="800" font-size="132"
        fill="#8ff24a" stroke="#ffffff" stroke-width="7" paint-order="stroke"
        letter-spacing="6">M.R</text>

  <!-- MOT -->
  <text x="780" y="610" text-anchor="middle"
        font-family="BarlowCondItalic" font-weight="800" font-size="248"
        fill="#8ff24a" stroke="#ffffff" stroke-width="13" paint-order="stroke"
        letter-spacing="6">MOT</text>

  <!-- Strapline -->
  <text x="780" y="700" text-anchor="middle"
        font-family="BarlowCondItalic" font-weight="700" font-size="82"
        fill="#ffffff" letter-spacing="2">MARTON ROAD MOT CENTRE</text>

  <!-- ══ Chrome divider bar ══════════════════════════════════════════ -->
  <rect x="186" y="716" width="1188" height="26" rx="13" fill="url(#chromeBar)"/>

  <!-- ══ Lower lime shield ═══════════════════════════════════════════ -->
  <path fill="#101314" d="
    M 404 748 L 1156 748 L 1156 906
    C 1156 906 986 1030 780 1030
    C 574 1030 404 906 404 906 Z"/>
  <path fill="url(#chrome)" d="
    M 416 754 L 1144 754 L 1144 900
    C 1144 900 980 1018 780 1018
    C 580 1018 416 900 416 900 Z"/>
  <path fill="url(#limeGrad)" d="
    M 442 762 L 1118 762 L 1118 890
    C 1118 890 966 992 780 992
    C 594 992 442 890 442 890 Z"/>

  <!-- Three chrome stars -->
  <g fill="url(#starGrad)" stroke="#6f7d83" stroke-width="4">
    <path transform="translate(628,872) scale(1.06)" d="M 0 -52 L 14.7 -16.1 L 52 -16.1 L 21.8 7.6 L 32.6 45 L 0 22.7 L -32.6 45 L -21.8 7.6 L -52 -16.1 L -14.7 -16.1 Z"/>
    <path transform="translate(780,876) scale(1.24)" d="M 0 -52 L 14.7 -16.1 L 52 -16.1 L 21.8 7.6 L 32.6 45 L 0 22.7 L -32.6 45 L -21.8 7.6 L -52 -16.1 L -14.7 -16.1 Z"/>
    <path transform="translate(932,872) scale(1.06)" d="M 0 -52 L 14.7 -16.1 L 52 -16.1 L 21.8 7.6 L 32.6 45 L 0 22.7 L -32.6 45 L -21.8 7.6 L -52 -16.1 L -14.7 -16.1 Z"/>
  </g>
</svg>
