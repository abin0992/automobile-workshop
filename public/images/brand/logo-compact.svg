      <stop offset="0.32" stop-color="#dde4e8"/>
      <stop offset="0.60" stop-color="#9aa8ae"/>
      <stop offset="0.82" stop-color="#75838a"/>
      <stop offset="1"    stop-color="#5a686e"/>
    </linearGradient>

    <linearGradient id="starGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#f4f8f9"/>
      <stop offset="0.5" stop-color="#adbabf"/>
      <stop offset="1"   stop-color="#76848a"/>
    </linearGradient>

    <linearGradient id="limeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#8ee04a"/>
      <stop offset="1"   stop-color="#61c024"/>
    </linearGradient>
  </defs>

