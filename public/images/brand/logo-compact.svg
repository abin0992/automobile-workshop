<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" width="1000" height="790">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.16" stop-color="#eaeff1"/>
      <stop offset="0.40" stop-color="#a2b0b5"/>
      <stop offset="0.52" stop-color="#7d8d93"/>
      <stop offset="0.64" stop-color="#bcc8cc"/>
      <stop offset="0.86" stop-color="#e6ecee"/>
      <stop offset="1"    stop-color="#a7b3b7"/>
    </linearGradient>

    <linearGradient id="chromeBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#f6fafb"/>
      <stop offset="0.42" stop-color="#c6d2d6"/>
      <stop offset="0.56" stop-color="#8a989e"/>
      <stop offset="1"    stop-color="#e2e9eb"/>
    </linearGradient>

    <linearGradient id="carBody" x1="0.2" y1="0" x2="0.45" y2="1">
