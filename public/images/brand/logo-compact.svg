    <path transform="translate(500,644) scale(1.0)"  d="M 0 -44 L 12.4 -13.6 L 44 -13.6 L 18.4 6.4 L 27.6 38 L 0 19.2 L -27.6 38 L -18.4 6.4 L -44 -13.6 L -12.4 -13.6 Z"/>
    <path transform="translate(592,640) scale(0.82)" d="M 0 -44 L 12.4 -13.6 L 44 -13.6 L 18.4 6.4 L 27.6 38 L 0 19.2 L -27.6 38 L -18.4 6.4 L -44 -13.6 L -12.4 -13.6 Z"/>
